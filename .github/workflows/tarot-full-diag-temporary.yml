name: Temporary Full Suite File Isolation
on:
  push:
    branches:
      - review/p0-full-stack-rehearsal
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: FILE tests/test_admin_boundary.py
        if: always()
        run: python -m pytest -q tests/test_admin_boundary.py
      - name: FILE tests/test_advanced_vc.py
        if: always()
        run: python -m pytest -q tests/test_advanced_vc.py
      - name: FILE tests/test_agency_heartbeat.py
