name: Temporary RPG Art Test Isolation
on:
  push:
    branches:
      - review/rpg-art-layer-v1
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: CASE test_all_eleven_portraits_have_distinct_slots_with_bot_six_identity
        if: always()
        run: python -m pytest -q tests/test_rpg_visuals.py::test_all_eleven_portraits_have_distinct_slots_with_bot_six_identity
      - name: CASE test_visuals_are_local_images_and_do_not_change_story
        if: always()
        run: python -m pytest -q tests/test_rpg_visuals.py::test_visuals_are_local_images_and_do_not_change_story
      - name: CASE test_war_table_reads_existing_completed_ranks_only
        if: always()
        run: python -m pytest -q tests/test_rpg_visuals.py::test_war_table_reads_existing_completed_ranks_only
      - name: CASE test_illustrated_send_preserves_original_embed_and_view_when_art_disabled
        if: always()
        run: python -m pytest -q tests/test_rpg_visuals.py::test_illustrated_send_preserves_original_embed_and_view_when_art_disabled
      - name: CASE test_illustrated_send_attaches_art_without_overwriting_embed_text
        if: always()
        run: python -m pytest -q tests/test_rpg_visuals.py::test_illustrated_send_attaches_art_without_overwriting_embed_text
      - name: CASE test_corrupted_and_takeover_portraits_are_isolated
        if: always()
        run: python -m pytest -q tests/test_rpg_visuals.py::test_corrupted_and_takeover_portraits_are_isolated
      - name: CASE test_rank_six_and_other_bosses_use_all_world_variants
        if: always()
        run: python -m pytest -q tests/test_rpg_visuals.py::test_rank_six_and_other_bosses_use_all_world_variants
      - name: CASE test_new_world_backdrop_is_detected_after_first_render
        if: always()
        run: python -m pytest -q tests/test_rpg_visuals.py::test_new_world_backdrop_is_detected_after_first_render
      - name: CASE test_opt_in_is_required_to_send_artwork
        if: always()
        run: python -m pytest -q tests/test_rpg_visuals.py::test_opt_in_is_required_to_send_artwork
      - name: CASE test_file_creation_failure_never_mutates_original_embed
        if: always()
        run: python -m pytest -q tests/test_rpg_visuals.py::test_file_creation_failure_never_mutates_original_embed
