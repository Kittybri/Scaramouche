name: Temporary Tarot Test Isolation
on:
  push:
    branches:
      - review/p0-full-stack-rehearsal
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: ISOLATE test_registration_keeps_prefix_and_removes_only_requested_slash_commands
        if: always()
        run: python -m pytest -q tests/test_tarot_restoration.py::test_registration_keeps_prefix_and_removes_only_requested_slash_commands
      - name: ISOLATE test_78_cards_unique_draws_and_rendering
        if: always()
        run: python -m pytest -q tests/test_tarot_restoration.py::test_78_cards_unique_draws_and_rendering
      - name: ISOLATE test_celtic_cross_retains_all_positions_without_message_overflow
        if: always()
        run: python -m pytest -q tests/test_tarot_restoration.py::test_celtic_cross_retains_all_positions_without_message_overflow
      - name: ISOLATE test_store_restart_user_isolation_and_revoked_views_cannot_restore_data
        if: always()
        run: python -m pytest -q tests/test_tarot_restoration.py::test_store_restart_user_isolation_and_revoked_views_cannot_restore_data
      - name: ISOLATE test_daily_is_stable_and_forget_topic_escapes_wildcards
        if: always()
        run: python -m pytest -q tests/test_tarot_restoration.py::test_daily_is_stable_and_forget_topic_escapes_wildcards
      - name: ISOLATE test_wrong_user_and_deleted_session_rejected
        if: always()
        run: python -m pytest -q tests/test_tarot_restoration.py::test_wrong_user_and_deleted_session_rejected
      - name: ISOLATE test_slash_private_delivery_and_prefix_controls
        if: always()
        run: python -m pytest -q tests/test_tarot_restoration.py::test_slash_private_delivery_and_prefix_controls
      - name: ISOLATE test_private_prefix_dm_failure_does_not_leak_question
        if: always()
        run: python -m pytest -q tests/test_tarot_restoration.py::test_private_prefix_dm_failure_does_not_leak_question
      - name: ISOLATE test_secret_and_high_stakes_never_reach_provider
        if: always()
        run: python -m pytest -q tests/test_tarot_restoration.py::test_secret_and_high_stakes_never_reach_provider
      - name: ISOLATE test_modal_followup_guard_and_owner_binding
        if: always()
        run: python -m pytest -q tests/test_tarot_restoration.py::test_modal_followup_guard_and_owner_binding
      - name: ISOLATE test_deletion_during_generation_prevents_result_and_save
        if: always()
        run: python -m pytest -q tests/test_tarot_restoration.py::test_deletion_during_generation_prevents_result_and_save
      - name: ISOLATE test_actual_bot_wiring_help_privacy_and_no_bulk_sync_regression
        if: always()
        run: python -m pytest -q tests/test_tarot_restoration.py::test_actual_bot_wiring_help_privacy_and_no_bulk_sync_regression
      - name: ISOLATE test_import_time_construction_does_not_require_running_event_loop
        if: always()
        run: python -m pytest -q tests/test_tarot_restoration.py::test_import_time_construction_does_not_require_running_event_loop
      - name: ISOLATE test_prefix_reading_and_daily_are_normal_revisitable_messages
        if: always()
        run: python -m pytest -q tests/test_tarot_restoration.py::test_prefix_reading_and_daily_are_normal_revisitable_messages
      - name: ISOLATE test_private_prefix_uses_actual_dm_not_ephemeral_guild_message
        if: always()
        run: python -m pytest -q tests/test_tarot_restoration.py::test_private_prefix_uses_actual_dm_not_ephemeral_guild_message
      - name: ISOLATE other tarot quality
        if: always()
        run: python -m pytest -q tests/test_tarot_quality.py
